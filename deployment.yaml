apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-grpc
  namespace: default
  labels:
    app: test-grpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-grpc
  template:
    metadata:
      labels:
        app: test-grpc
    spec:
      containers:
        - name: server
          image: ${IMAGE}
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: test-grpc
  namespace: default
  labels:
    app: test-grpc
  annotations:
    # Uses GRPC and the ingress will have stripped the TLS, so need to enable HTTP/2 cleartext.
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  type: ClusterIP
  selector:
    app: test-grpc
  ports:
    - name: grpc
      port: 50051
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-grpc-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: ${CLUSTER_ISSUER}
spec:
  ingressClassName: ${INGRESS_CLASS_NAME}
  tls:
    - hosts:
        - ${HOST}
      secretName: test-grpc-tls-secret
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-grpc
                port:
                  number: 50051
